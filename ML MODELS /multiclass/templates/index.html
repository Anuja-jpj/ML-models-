<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iris Flower Species Predictor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#eef5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.container{

    width:480px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0px 10px 25px rgba(0,0,0,.2);

}

h1{

    text-align:center;
    color:#1565c0;

}

h3{

    text-align:center;
    color:#555;
    margin-top:8px;
    margin-bottom:25px;

}

label{

    font-weight:bold;
    display:block;
    margin-top:12px;
    margin-bottom:6px;

}

input{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}

button{

    width:100%;
    margin-top:25px;
    padding:13px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#0d47a1;

}

.result{

    margin-top:25px;
    background:#e8f5e9;
    padding:18px;
    border-radius:8px;
    text-align:center;
    color:green;
    font-size:22px;
    font-weight:bold;

}

footer{

    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

<h1>Iris Flower Predictor</h1>

<h3>Multiclass Classification using Logistic Regression</h3>

<form action="/predict" method="POST">

<label>Sepal Length (cm)</label>

<input
type="number"
name="sepal_length"
step="0.1"
placeholder="Enter Sepal Length:4.3 to 7.9 cm"
required>

<label>Sepal Width (cm)</label>

<input
type="number"
name="sepal_width"
step="0.1"
placeholder="Enter Sepal Width:2.0 to 4.4 cm"
required>

<label>Petal Length (cm)</label>

<input
type="number"
name="petal_length"
step="0.1"
placeholder="Enter Petal Length:1.0 to 6.9 cm"
required>

<label>Petal Width (cm)</label>

<input
type="number"
name="petal_width"
step="0.1"
placeholder="Enter Petal Width:0.1 to 2.5 cm"
required>

<button type="submit">

Predict Flower Species

</button>

</form>

{% if prediction_text %}

<div class="result">

{{ prediction_text }}

</div>

{% endif %}

<footer>

By Anuja More

</footer>

</div>

</body>

</html>
