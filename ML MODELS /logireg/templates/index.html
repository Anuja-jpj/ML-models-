<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #777;
        }

        .form-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        .input-box input,
        .input-box select {
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .input-box input:focus,
        .input-box select:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 30px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #5645c4;
        }

        .result {
            margin-top: 30px;

            padding: 20px;

            text-align: center;

            background: #f4f7ff;

            border-radius: 10px;
        }

        .result h2 {
            color: #333;

            margin-bottom: 10px;
        }

        .result p {
            font-size: 18px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="header">

            <h1>Customer Churn Prediction</h1>

            <p>
                Enter customer details to predict whether the
                customer will leave the bank.
            </p>

        </div>


        <form action="/predict" method="POST">

            <div class="form-grid">


                <div class="input-box">

                    <label>Credit Score</label>

                    <input
                        type="number"
                        name="credit_score"
                        placeholder="Enter Credit Score"
                        required>

                </div>


                <div class="input-box">

                    <label>Geography</label>

                    <select name="geography" required>

                        <option value="">Select Country</option>

                        <option value="France">France</option>

                        <option value="Germany">Germany</option>

                        <option value="Spain">Spain</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="">Select Gender</option>

                        <option value="Male">Male</option>

                        <option value="Female">Female</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        placeholder="Enter Age"
                        required>

                </div>


                <div class="input-box">

                    <label>Tenure</label>

                    <input
                        type="number"
                        name="tenure"
                        placeholder="Enter Tenure"
                        required>

                </div>


                <div class="input-box">

                    <label>Balance</label>

                    <input
                        type="number"
                        step="any"
                        name="balance"
                        placeholder="Enter Balance"
                        required>

                </div>


                <div class="input-box">

                    <label>Number of Products</label>

                    <input
                        type="number"
                        name="num_products"
                        placeholder="Enter Number of Products"
                        required>

                </div>


                <div class="input-box">

                    <label>Has Credit Card?</label>

                    <select name="has_card" required>

                        <option value="">Select</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Active Member?</label>

                    <select name="active_member" required>

                        <option value="">Select</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Estimated Salary</label>

                    <input
                        type="number"
                        step="any"
                        name="estimated_salary"
                        placeholder="Enter Salary"
                        required>

                </div>


            </div>


            <button type="submit">
                Predict Churn
            </button>

        </form>


        {% if prediction_text %}

        <div class="result">

            <h2>{{ prediction_text }}</h2>

            <p>
                Probability of Customer Leaving:
                <strong>{{ probability }}%</strong>
            </p>

        </div>

        {% endif %}


    </div>

</body>

</html>
